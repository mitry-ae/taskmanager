global:
  resolve_timeout: 5m

route:
  receiver: "email"
  group_by: ["alertname", "mountpoint"]
  routes:
    - matchers:
      - severity="critical"
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 2h

    - matchers:
      - severity="warning"
      group_wait: 30s
      group_interval: 10m
      repeat_interval: 4h



receivers:
  - name: "email"
    email_configs:
      - to: mitry.ae@yandex.ru
        from: war-machine2013@yandex.ru
        smarthost: smtp.yandex.ru:465
        auth_username: war-machine2013@yandex.ru
        auth_password_file: /etc/alertmanager/smtp_password