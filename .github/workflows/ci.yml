# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          PORT: 3000
          DATABASE_URL: postgres://test:test@localhost:5432/test
          JWT_SECRET: test-secret
          JWT_EXPIRES: 1h
  build-and-push:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{steps.vars.outputs.sha_short}}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set short sha
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mitry-ae/taskmanager:latest
            ghcr.io/mitry-ae/taskmanager:${{steps.vars.outputs.sha_short}}
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{needs.build-and-push.outputs.sha_short}}
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.SSH_HOST}}
          username: ${{secrets.SSH_USER}}
          key: ${{secrets.SSH_PRIVATE_KEY}}
          envs: IMAGE_TAG
          script: |
            set -e
            cd /home/taskmanager
            git pull
            docker compose pull
            docker compose run --rm app npm run migrate:prod
            docker compose up -d --wait postgres app nginx
            docker compose exec nginx nginx -s reload